name: Checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Formato Rust
        run: cargo fmt --check
      - name: Análisis estático Rust
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Pruebas unitarias e integración Rust
        run: cargo test --locked
      - name: Compilar backend para las pruebas de navegador
        run: cargo build --locked
      - name: Instalar dependencias del frontend
        run: npm --prefix frontend ci
      - name: TypeScript y compilación del frontend
        run: npm --prefix frontend run build
      - name: Instalar Chromium
        run: npm --prefix frontend exec -- playwright install --with-deps chromium
      - name: Pruebas del validador de resultados
        run: python3 -m unittest discover -s scripts -p 'test_soak_test.py' -v
      - name: Pruebas de navegador
        run: npm --prefix frontend run test:e2e
      - name: Compilar demo de GitHub Pages
        run: npm --prefix frontend run build:demo
      - name: Probar simulación y demo sin backend
        run: npm --prefix frontend run test:demo
      - name: Guardar reporte de navegador y evidencia de fallos
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            playwright-report-demo/
            test-results-demo/
          if-no-files-found: ignore
          retention-days: 14

  pages:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build:demo
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist-demo
      - name: Publicar demo
        id: deployment
        uses: actions/deploy-pages@v5
